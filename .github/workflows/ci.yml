name: CI/CD Pipeline

on:
  push:
    branches: [main, claude/containerize-microservices-*]
  pull_request:
    branches: [main]

env:
  REGISTRY: localhost:5000

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python linters
        run: |
          pip install flake8

      - name: Lint Python code
        run: |
          flake8 api/ worker/ --count --statistics

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: |
          npm ci --prefix frontend

      - name: Lint JavaScript
        run: |
          npm run --prefix frontend lint || npx eslint frontend/

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3
        with:
          dockerfile: api/Dockerfile
          ignore: DL3008,DL3009

      - name: Lint Dockerfiles (worker)
        uses: hadolint/hadolint-action@v3
        with:
          dockerfile: worker/Dockerfile
          ignore: DL3008,DL3009

      - name: Lint Dockerfiles (frontend)
        uses: hadolint/hadolint-action@v3
        with:
          dockerfile: frontend/Dockerfile
          ignore: DL3008,DL3009

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt -r api/requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest api/tests/ -v --cov=api --cov-report=xml --cov-report=html

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml

  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: test
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-options: image=moby/buildkit:latest

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            localhost:5000/api:${{ github.sha }}
            localhost:5000/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Worker image
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          push: true
          tags: |
            localhost:5000/worker:${{ github.sha }}
            localhost:5000/worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            localhost:5000/frontend:${{ github.sha }}
            localhost:5000/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save images
        run: |
          docker pull localhost:5000/api:${{ github.sha }}
          docker pull localhost:5000/worker:${{ github.sha }}
          docker pull localhost:5000/frontend:${{ github.sha }}
          docker save \
            localhost:5000/api:${{ github.sha }} \
            localhost:5000/worker:${{ github.sha }} \
            localhost:5000/frontend:${{ github.sha }} \
            -o /tmp/images-${{ github.sha }}.tar

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ github.sha }}
          path: /tmp/images-${{ github.sha }}.tar

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download images
        uses: actions/download-artifact@v4
        with:
          name: images-${{ github.sha }}
          path: /tmp

      - name: Load images
        run: |
          docker load -i /tmp/images-${{ github.sha }}.tar

      - name: Scan API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: localhost:5000/api:${{ github.sha }}
          format: 'sarif'
          output: 'api.sarif'
          severity: 'CRITICAL'
          exit-code: '1'

      - name: Scan Worker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: localhost:5000/worker:${{ github.sha }}
          format: 'sarif'
          output: 'worker.sarif'
          severity: 'CRITICAL'
          exit-code: '1'

      - name: Scan Frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: localhost:5000/frontend:${{ github.sha }}
          format: 'sarif'
          output: 'frontend.sarif'
          severity: 'CRITICAL'
          exit-code: '1'

      - name: Upload SARIF reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif-reports
          path: |
            api.sarif
            worker.sarif
            frontend.sarif

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4

      - name: Download images
        uses: actions/download-artifact@v4
        with:
          name: images-${{ github.sha }}
          path: /tmp

      - name: Load images
        run: |
          docker load -i /tmp/images-${{ github.sha }}.tar

      - name: Tag images for compose
        run: |
          docker tag localhost:5000/api:${{ github.sha }} api:latest
          docker tag localhost:5000/worker:${{ github.sha }} worker:latest
          docker tag localhost:5000/frontend:${{ github.sha }} frontend:latest

      - name: Create .env file
        run: |
          cat > .env <<EOF
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=${{ github.run_id }}
          API_URL=http://api:8000
          PORT=3000
          EOF

      - name: Start services
        run: |
          docker compose up -d --wait --timeout 60

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            curl -s http://localhost:3000/health && echo "Frontend healthy" && break
            sleep 2
          done

      - name: Submit job
        run: |
          JOB_ID=$(curl -s -X POST http://localhost:3000/submit | jq -r '.job_id')
          echo "JOB_ID=$JOB_ID" >> $GITHUB_ENV

      - name: Poll job status
        run: |
          for i in {1..30}; do
            STATUS=$(curl -s http://localhost:3000/status/$JOB_ID | jq -r '.status')
            echo "Job status: $STATUS"
            if [ "$STATUS" = "completed" ]; then
              echo "Job completed successfully"
              exit 0
            fi
            sleep 2
          done
          echo "Job did not complete in time"
          exit 1

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose logs

      - name: Tear down
        if: always()
        run: |
          docker compose down -v

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Download images
        uses: actions/download-artifact@v4
        with:
          name: images-${{ github.sha }}
          path: /tmp

      - name: Load images
        run: |
          docker load -i /tmp/images-${{ github.sha }}.tar

      - name: Create .env file
        run: |
          cat > .env <<EOF
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=${{ github.run_id }}
          API_URL=http://api:8000
          PORT=3000
          EOF

      - name: Run rolling deploy
        run: |
          bash scripts/rolling-deploy.sh

      - name: Verify deployment
        run: |
          docker compose ps
          curl -s http://localhost:3000/health
